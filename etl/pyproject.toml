[project]
name = "new-facturacion"
version = "0.1.0"
description = "ELT Pipeline for Billing Data Migration from Talend to GCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-bigquery>=3.14.0",
    "google-cloud-storage>=2.10.0",
    "google-cloud-secret-manager>=2.16.0",
    "simple-salesforce>=1.12.4",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "httpx>=0.24.0",
    "pytz>=2024.1",
    "pyjks>=20.0.0",
    "cryptography>=48.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
dbt = [
    "dbt-core>=1.7.0",
    "dbt-bigquery>=1.7.0",
]
