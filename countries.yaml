# ─────────────────────────────────────────────────────────────────────────────
# FUENTE ÚNICA de la configuración de países del sistema de facturación GCP.
#
# Hoy esta info está duplicada en:
#   - infra/tfvars/<país>.tfvars        (Terraform: despliegue por país)
#   - infra/global/terraform.tfvars     (Terraform: mapa del consolidado + overrides)
#   - etl/.env.<país>                   (Python: config de la ETL, p.ej. .env.win_es)
#
# OBJETIVO: que este fichero sea el único sitio donde se edita un país, y que unos
# generadores produzcan los tfvars y los .env.<país> a partir de aquí (ver docs/UNIFICACION_PROYECTOS.md, Fase 2).
# Por ahora es la fuente declarada; los generadores son trabajo de la Fase 2.
#
# Campos por país:
#   project_id        : proyecto GCP real del país (donde vive su facturación)
#   region            : location de BigQuery de sus datos (casi todos EU; Brasil southamerica-east1)
#   export_dataset    : dataset del export de Google (BILLING*_CLOUD_PLATFORM)
#   talend_context    : nombre del contexto Talend equivalente (referencia histórica)
#   sf_empresa_ip     : cláusula Empresa_IP__c de Salesforce (filtro de oportunidades)
#   status            : new | legacy_eu | cross_region | central
#   consolidado       : cómo lo lee el consolidado global (looker_views_global)
#     source_project  : proyecto desde el que el UNION lee este país
#     looker_dataset  : dataset de las 7 vistas (looker_views | consolidado_src | br_src)
#     billing_dataset : dataset de importes_lecturas_workspace (billing_views | consolidado_src | br_src)
# ─────────────────────────────────────────────────────────────────────────────

# Países NUEVOS: ya estándar, el consolidado los lee de looker_views en vivo.
belgium:
  project_id: swobe-billing-prod
  region: EU
  export_dataset: BILLINGBE_CLOUD_PLATFORM
