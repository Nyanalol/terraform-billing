# ─────────────────────────────────────────────────────────────────────────────
# FUENTE ÚNICA de la configuración de países del sistema de facturación GCP.
#
# Hoy esta info está duplicada en:
#   - infra/tfvars/<país>.tfvars        (Terraform: despliegue por país)
#   - infra/global/terraform.tfvars     (Terraform: mapa del consolidado + overrides)
#   - etl/.env.<país>                   (Python: config de la ETL, p.ej. .env.win_es)
#
# OBJETIVO: que este sea el ÚNICO sitio donde se edita un país. Tres generadores
# producen el resto (NO editar a mano los ficheros generados):
#   tools/gen_tfvars.py        -> infra/tfvars/<país>.tfvars       (despliegue por país)
#   tools/gen_global_tfvars.py -> infra/global/terraform.tfvars    (mapa del consolidado)
#   tools/gen_env.py           -> etl/.env.<contexto>              (config de la ETL)
# Verificación sin tocar nada: `python tools/gen_tfvars.py --check` (compara por valor
# semántico, ignora comentarios/orden = lo que ve Terraform).
#
# Campos por país:
#   project_id        : proyecto GCP real del país (donde vive su facturación)
#   region            : location de BigQuery de sus datos (casi todos EU; Brasil southamerica-east1)
#   export_dataset    : dataset del export de Google (BILLING*_CLOUD_PLATFORM)
#   talend_context    : nombre del contexto Talend equivalente; sufijo = código del bucket/staging
#   currency          : divisa de facturación del país (la lista CURRENCIES del .env es la unión global)
#   sf_empresa_ip     : cláusula Empresa_IP__c de Salesforce (filtro de oportunidades)
#   status            : new | legacy_eu | cross_region | central (deriva flags por defecto de los tfvars)
#   consolidado       : cómo lo lee el consolidado global (looker_views_global)
#     source_project  : proyecto desde el que el UNION lee este país
#     looker_dataset  : dataset de las 7 vistas (looker_views | consolidado_src | br_src)
#     billing_dataset : dataset de importes_lecturas_workspace (billing_views | consolidado_src | br_src)
#   payer_billing_accounts : cuentas pagadoras {id = nombre} (seed de la tabla payer_billing_accounts)
#   tf                : overrides de los flags del tfvars que se desvían del default por status
#                       (create_service_account, create_hmac_key, country, manage_spain_iam, ...)
# ─────────────────────────────────────────────────────────────────────────────

